apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: rook-ceph-operator
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: rook-ceph
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: rook-ceph
        namespace: rook-ceph
      spec:
        interval: 10m0s
        url: https://charts.rook.io/release

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: rook-ceph
        namespace: rook-ceph
      spec:
        interval: 1h
        releaseName: rook-ceph
        chart:
          spec:
            chart: rook-ceph
            # renovate: datasource=helm depName=rook-ceph registryUrl=https://charts.rook.io/release
            version: v1.20.6
            sourceRef:
              kind: HelmRepository
              name: rook-ceph
        values: {}

---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: ceph-csi-drivers
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: ceph-csi-operator
        namespace: rook-ceph
      spec:
        interval: 10m0s
        url: https://ceph.github.io/ceph-csi-operator/

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: ceph-csi-drivers
        namespace: rook-ceph
      spec:
        interval: 1h
        releaseName: ceph-csi-drivers
        chart:
          spec:
            chart: ceph-csi-drivers
            # renovate: datasource=helm depName=ceph-csi-drivers registryUrl=https://ceph.github.io/ceph-csi-operator/
            version: v1.0.4
            sourceRef:
              kind: HelmRepository
              name: ceph-csi-operator
        values:
          operatorConfig:
            namespace: rook-ceph # namespace:operator
            driverSpecDefaults:
              imageSet:
                name: rook-csi-operator-image-set-configmap
              nodePlugin:
                priorityClassName: system-node-critical
              controllerPlugin:
                priorityClassName: system-cluster-critical

          drivers:
            rbd:
              enabled: true
              name: rook-ceph.rbd.csi.ceph.com # csi-provisioner-name
            cephfs:
              enabled: true
              name: rook-ceph.cephfs.csi.ceph.com # csi-provisioner-name
            nfs:
              enabled: false
              name: rook-ceph.nfs.csi.ceph.com # csi-provisioner-name
            nvmeof:
              enabled: false
              name: rook-ceph.nvmeof.csi.ceph.com # csi-provisioner-name

    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: cephfs-ctrlplugin-sa
        namespace: rook-ceph

    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: cephfs-nodeplugin-sa
        namespace: rook-ceph

    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: rbd-ctrlplugin-sa
        namespace: rook-ceph

    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: rbd-nodeplugin-sa
        namespace: rook-ceph

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: cephfs-ctrlplugin-rb
        namespace: rook-ceph
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: rook-ceph-cephfs-csi-ceph-com-ctrlplugin-r
      subjects:
      - kind: ServiceAccount
        name: cephfs-ctrlplugin-sa
        namespace: rook-ceph

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: cephfs-nodeplugin-rb
        namespace: rook-ceph
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: rook-ceph-cephfs-csi-ceph-com-nodeplugin-r
      subjects:
      - kind: ServiceAccount
        name: cephfs-nodeplugin-sa
        namespace: rook-ceph

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: rbd-ctrlplugin-rb
        namespace: rook-ceph
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: rook-ceph-rbd-csi-ceph-com-ctrlplugin-r
      subjects:
      - kind: ServiceAccount
        name: rbd-ctrlplugin-sa
        namespace: rook-ceph

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: rbd-nodeplugin-rb
        namespace: rook-ceph
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: rook-ceph-rbd-csi-ceph-com-nodeplugin-r
      subjects:
      - kind: ServiceAccount
        name: rbd-nodeplugin-sa
        namespace: rook-ceph

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: cephfs-ctrlplugin-crb
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: rook-ceph-cephfs-csi-ceph-com-ctrlplugin-cr
      subjects:
      - kind: ServiceAccount
        name: cephfs-ctrlplugin-sa
        namespace: rook-ceph

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: cephfs-nodeplugin-crb
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: rook-ceph-cephfs-csi-ceph-com-nodeplugin-cr
      subjects:
      - kind: ServiceAccount
        name: cephfs-nodeplugin-sa
        namespace: rook-ceph

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: rbd-ctrlplugin-crb
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: rook-ceph-rbd-csi-ceph-com-ctrlplugin-cr
      subjects:
      - kind: ServiceAccount
        name: rbd-ctrlplugin-sa
        namespace: rook-ceph

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: rbd-nodeplugin-crb
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: rook-ceph-rbd-csi-ceph-com-nodeplugin-cr
      subjects:
      - kind: ServiceAccount
        name: rbd-nodeplugin-sa
        namespace: rook-ceph
